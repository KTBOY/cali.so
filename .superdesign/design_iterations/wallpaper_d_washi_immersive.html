<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>方案D · 壁纸中心 — 和纸沉浸风（日系留白 × 沉浸画廊）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{background:#fafaf9}
    ::-webkit-scrollbar{height:6px;width:6px}
    ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:3px}
    .thumb-strip{scrollbar-width:thin}
  </style>
</head>
<body class="min-h-screen text-zinc-800 antialiased">
  <div class="mx-auto max-w-6xl px-4 py-12 sm:px-8">

    <!-- ============ 和纸头图（保留 B 的留白气质） ============ -->
    <div class="relative overflow-hidden rounded-[2rem] border border-black/[0.06] bg-gradient-to-b from-sky-50/80 via-rose-50/40 to-white shadow-[0_20px_60px_-32px_rgba(0,0,0,0.25)]">
      <!-- 柔光晕染 -->
      <div class="pointer-events-none absolute -left-24 -top-24 h-72 w-72 rounded-full bg-sky-200/50 blur-3xl"></div>
      <div class="pointer-events-none absolute -right-20 top-8 h-72 w-72 rounded-full bg-rose-200/40 blur-3xl"></div>
      <div class="pointer-events-none absolute bottom-[-6rem] left-1/3 h-64 w-64 rounded-full bg-violet-200/40 blur-3xl"></div>

      <div class="relative flex flex-wrap items-end justify-between gap-6 px-6 py-12 sm:px-14 sm:py-16">
        <div>
          <span class="inline-flex items-center gap-2 rounded-full border border-black/[0.06] bg-white/70 px-4 py-1.5 text-xs font-medium tracking-[0.2em] text-zinc-500 backdrop-blur">
            <span class="inline-block h-1.5 w-1.5 rounded-full bg-sky-400/80"></span>
            壁纸箱 · WALLPAPER
          </span>

          <h1 class="mt-6 text-4xl font-semibold tracking-tight text-zinc-800 sm:text-5xl">壁纸中心</h1>
          <p class="mt-3 text-sm font-light tracking-[0.35em] text-zinc-400">きせかえの小部屋</p>

          <p class="mt-6 max-w-xl text-base font-light leading-loose text-zinc-500">
            一处安静的壁纸收纳所。点击下方缩略图即刻大图预览，<br class="hidden sm:block" />
            每一次「换一批」，都像翻开新的一页画集。
          </p>
        </div>

        <!-- 分类 + 换一批 -->
        <div class="flex flex-col items-start gap-3 sm:items-end">
          <div class="flex items-center gap-1 rounded-full border border-black/[0.06] bg-white/80 p-1 shadow-sm backdrop-blur">
            <button data-id="img1" class="tab rounded-full bg-zinc-800 px-4 py-1.5 text-xs font-medium text-white transition">二次元</button>
            <button data-id="pc" class="tab rounded-full px-4 py-1.5 text-xs font-light text-zinc-500 transition hover:text-zinc-800">电脑壁纸</button>
          </div>
          <button id="refresh" class="group inline-flex items-center gap-2 rounded-full border border-black/[0.06] bg-white px-5 py-2 text-sm font-medium text-zinc-600 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">
            <svg class="h-4 w-4 text-rose-400 transition-transform duration-500 group-hover:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
            换一批
          </button>
        </div>
      </div>
    </div>

    <!-- ============ 沉浸预览台（保留 C 的大图 + 模糊铺底结构，改为浅色相框） ============ -->
    <div class="relative mt-10 overflow-hidden rounded-[2rem] border border-black/[0.06] bg-white p-2 shadow-[0_24px_70px_-36px_rgba(0,0,0,0.35)] sm:p-3">
      <div class="relative overflow-hidden rounded-[1.5rem]">
        <!-- 当前壁纸模糊铺底 -->
        <img id="heroBg" class="absolute inset-0 h-full w-full scale-110 object-cover opacity-50 blur-2xl transition-all duration-700" alt="" />
        <div class="absolute inset-0 bg-gradient-to-b from-white/60 via-white/20 to-white/70"></div>

        <!-- 大图 -->
        <div class="relative">
          <div id="heroLoading" class="absolute inset-0 z-10 flex items-center justify-center bg-white/50 backdrop-blur-sm">
            <span class="h-8 w-8 animate-spin rounded-full border-2 border-zinc-200 border-t-rose-400"></span>
          </div>
          <img id="heroImg" class="h-[300px] w-full object-contain drop-shadow-xl transition-opacity duration-500 sm:h-[460px]" alt="当前壁纸" />
        </div>

        <!-- 底部操作条（浅色毛玻璃） -->
        <div class="absolute inset-x-0 bottom-0 flex items-center justify-between bg-gradient-to-t from-white/90 via-white/50 to-transparent px-5 py-4">
          <span id="heroIndex" class="rounded-full border border-black/[0.06] bg-white/80 px-3 py-1 text-xs font-light tracking-widest text-zinc-500 backdrop-blur">1 / 10</span>
          <div class="flex items-center gap-2">
            <a id="heroOpen" target="_blank" class="rounded-full border border-black/[0.06] bg-white/80 px-4 py-1.5 text-xs font-medium text-zinc-600 backdrop-blur transition hover:text-zinc-900 hover:shadow-md">查看原图</a>
            <a id="heroDown" target="_blank" download class="inline-flex items-center gap-1.5 rounded-full bg-zinc-800 px-4 py-1.5 text-xs font-medium text-white transition hover:-translate-y-0.5 hover:bg-zinc-700 hover:shadow-lg">
              <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
              保存壁纸
            </a>
          </div>
        </div>
      </div>

      <!-- 缩略图胶卷（白色相框小卡） -->
      <div id="strip" class="thumb-strip mt-3 flex gap-3 overflow-x-auto px-1 pb-2"></div>
    </div>

    <p class="mt-10 text-center text-xs font-light tracking-widest text-zinc-400">
      图片来源 · MoeHu 随机图片 API
    </p>
  </div>

  <script>
    const API = 'https://img.moehu.org/pic.php'
    let currentId = 'img1'
    let pics = []

    const strip = document.getElementById('strip')
    const heroImg = document.getElementById('heroImg')
    const heroBg = document.getElementById('heroBg')
    const heroLoading = document.getElementById('heroLoading')

    function show(i) {
      const url = pics[i]
      heroLoading.style.display = 'flex'
      heroImg.style.opacity = '0'
      heroImg.onload = () => { heroLoading.style.display = 'none'; heroImg.style.opacity = '1' }
      heroImg.src = url
      heroBg.src = url
      document.getElementById('heroIndex').textContent = `${i + 1} / ${pics.length}`
      document.getElementById('heroOpen').href = url
      document.getElementById('heroDown').href = url
      strip.querySelectorAll('img').forEach((t, idx) => {
        t.className = idx === i
          ? 'h-20 w-32 flex-none cursor-pointer rounded-2xl border-2 border-rose-300 object-cover shadow-md transition'
          : 'h-20 w-32 flex-none cursor-pointer rounded-2xl border-2 border-transparent object-cover opacity-45 transition hover:opacity-90'
      })
    }

    async function load() {
      strip.innerHTML = '<span class="py-8 text-sm font-light tracking-widest text-zinc-400">加载中…</span>'
      heroLoading.style.display = 'flex'
      try {
        const res = await fetch(`${API}?return=json&id=${currentId}&num=10&_=${Date.now()}`)
        const data = await res.json()
        pics = data.pic || []
        strip.innerHTML = ''
        pics.forEach((url, i) => {
          const t = document.createElement('img')
          t.src = url
          t.loading = 'lazy'
          t.addEventListener('click', () => show(i))
          strip.appendChild(t)
        })
        if (pics.length) show(0)
      } catch (e) {
        strip.innerHTML = '<span class="py-8 text-sm text-rose-400">加载失败，请点击「换一批」重试</span>'
        heroLoading.style.display = 'none'
      }
    }

    document.querySelectorAll('.tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        currentId = btn.dataset.id
        document.querySelectorAll('.tab').forEach((b) => {
          b.className = 'tab rounded-full px-4 py-1.5 text-xs font-light text-zinc-500 transition hover:text-zinc-800'
        })
        btn.className = 'tab rounded-full bg-zinc-800 px-4 py-1.5 text-xs font-medium text-white transition'
        load()
      })
    })
    document.getElementById('refresh').addEventListener('click', load)
    load()
  </script>
</body>
</html>
