<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>方案B · 壁纸中心 — 日系和纸留白风（对齐工具库）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{background:#fafaf9}
    .masonry{column-count:2;column-gap:1.25rem}
    @media(min-width:640px){.masonry{column-count:3}}
    @media(min-width:1024px){.masonry{column-count:4}}
    .masonry>div{break-inside:avoid;margin-bottom:1.25rem}
  </style>
</head>
<body class="min-h-screen text-zinc-800 antialiased">
  <div class="mx-auto max-w-6xl px-4 py-12 sm:px-8">

    <!-- 和纸头图 -->
    <div class="relative overflow-hidden rounded-[2rem] border border-black/[0.06] bg-gradient-to-b from-sky-50/80 via-rose-50/40 to-white shadow-[0_20px_60px_-32px_rgba(0,0,0,0.25)]">
      <!-- 柔光晕染 -->
      <div class="pointer-events-none absolute -left-24 -top-24 h-72 w-72 rounded-full bg-sky-200/50 blur-3xl"></div>
      <div class="pointer-events-none absolute -right-20 top-8 h-72 w-72 rounded-full bg-rose-200/40 blur-3xl"></div>
      <div class="pointer-events-none absolute bottom-[-6rem] left-1/3 h-64 w-64 rounded-full bg-violet-200/40 blur-3xl"></div>

      <div class="relative px-6 py-14 sm:px-14 sm:py-20">
        <span class="inline-flex items-center gap-2 rounded-full border border-black/[0.06] bg-white/70 px-4 py-1.5 text-xs font-medium tracking-[0.2em] text-zinc-500 backdrop-blur">
          <span class="inline-block h-1.5 w-1.5 rounded-full bg-sky-400/80"></span>
          壁纸箱 · WALLPAPER
        </span>

        <h1 class="mt-7 text-4xl font-semibold tracking-tight text-zinc-800 sm:text-6xl">壁纸中心</h1>
        <p class="mt-3 text-sm font-light tracking-[0.35em] text-zinc-400">きせかえの小部屋</p>

        <p class="mt-8 max-w-xl text-base font-light leading-loose text-zinc-500">
          一处安静的壁纸收纳所。<br />
          把喜欢的二次元与动漫壁纸，收拢在同一片留白之中，<br />
          每一次「换一批」，都像翻开新的一页画集。
        </p>
      </div>
    </div>

    <!-- 分类与操作 -->
    <div class="mt-12 flex flex-wrap items-center justify-between gap-4">
      <div class="flex flex-wrap items-center gap-2.5">
        <button data-id="img1" class="tab rounded-full bg-zinc-800 px-5 py-2 text-sm font-medium text-white shadow-sm transition">二次元壁纸</button>
        <button data-id="pc" class="tab rounded-full border border-black/[0.06] bg-white/80 px-5 py-2 text-sm font-light text-zinc-500 shadow-sm transition hover:text-zinc-800">电脑壁纸</button>
      </div>
      <div class="flex items-center gap-4">
        <span class="text-xs font-light tracking-widest text-zinc-400">12 枚 · 随机拾取</span>
        <button id="refresh" class="group inline-flex items-center gap-2 rounded-full border border-black/[0.06] bg-white px-5 py-2 text-sm font-medium text-zinc-600 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">
          <svg class="h-4 w-4 text-rose-400 transition-transform duration-500 group-hover:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
          换一批
        </button>
      </div>
    </div>

    <!-- 瀑布流 -->
    <div id="grid" class="masonry mt-8"></div>

    <p class="mt-10 text-center text-xs font-light tracking-widest text-zinc-400">
      图片来源 · MoeHu 随机图片 API
    </p>
  </div>

  <script>
    const API = 'https://img.moehu.org/pic.php'
    let currentId = 'img1'
    const grid = document.getElementById('grid')

    function load() {
      grid.innerHTML = ''
      for (let i = 0; i < 12; i++) {
        const wrap = document.createElement('div')
        wrap.className = 'group relative overflow-hidden rounded-3xl border border-black/[0.06] bg-white p-1.5 shadow-[0_10px_40px_-24px_rgba(0,0,0,0.3)] transition-all duration-500 hover:-translate-y-1 hover:shadow-[0_24px_60px_-30px_rgba(0,0,0,0.35)]'
        const h = [200, 260, 320, 240][i % 4]
        wrap.innerHTML = `
          <div class="w-full animate-pulse rounded-[1.25rem] bg-zinc-100" style="height:${h}px"></div>
          <div class="flex items-center justify-between px-3 py-2.5">
            <span class="text-[11px] font-light tracking-[0.2em] text-zinc-400">No.${String(i + 1).padStart(2, '0')}</span>
            <span class="inline-flex items-center gap-1 text-xs font-medium text-zinc-400 transition-colors group-hover:text-zinc-700">
              保存
              <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
            </span>
          </div>`
        const img = document.createElement('img')
        img.src = `${API}?id=${currentId}&size=mw690&_=${Date.now()}-${i}`
        img.className = 'w-full rounded-[1.25rem] object-cover transition-transform duration-500 group-hover:scale-[1.02]'
        img.loading = 'lazy'
        img.onload = () => wrap.firstElementChild.replaceWith(img)
        grid.appendChild(wrap)
      }
    }

    document.querySelectorAll('.tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        currentId = btn.dataset.id
        document.querySelectorAll('.tab').forEach((b) => {
          b.className = 'tab rounded-full border border-black/[0.06] bg-white/80 px-5 py-2 text-sm font-light text-zinc-500 shadow-sm transition hover:text-zinc-800'
        })
        btn.className = 'tab rounded-full bg-zinc-800 px-5 py-2 text-sm font-medium text-white shadow-sm transition'
        load()
      })
    })
    document.getElementById('refresh').addEventListener('click', load)
    load()
  </script>
</body>
</html>
